<title>말랑이 온라인</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one phone-shaped app column, sticky top bar, scrolling screens, fixed bottom tab bar.
   Deliberately single-theme: a pastel candy world that looks the same on any host background. */
:root{
  --bg:#FFF3F9; --bg2:#F4EEFF; --card:#FFFFFF; --ink:#4A3B57; --muted:#9C8CAB; --line:#F2D8E8;
  --pink:#FF6FAE; --pink-soft:#FFE1EE; --mint:#6FD3AA; --sky:#8CCBF5; --lemon:#FFD45E; --lav:#A98BF2; --red:#F0566B;
  --display:"Jua","Arial Rounded MT Bold","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-block:10px}
.me{display:flex;align-items:center;gap:8px;min-width:0;flex:1;text-align:left}
.me .av{width:40px;height:40px;flex:none}
.me b{font-family:var(--display);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;color:var(--muted);font-size:12px}
.wallet{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--pink-soft);border-radius:999px;padding:5px 10px 5px 6px;
  font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none}

/* avatar frames */
.av{position:relative;border-radius:50%;background:var(--bg);display:grid;place-items:center;overflow:visible}
.av svg,.av img{width:88%;height:88%;object-fit:contain}
.av[data-frame="heart"]{box-shadow:0 0 0 3px #FF8DBE}
.av[data-frame="star"]{box-shadow:0 0 0 3px var(--lemon),0 0 0 6px #FFF1B8}
.av[data-frame="bat"]{box-shadow:0 0 0 3px #6B4E8E,0 0 0 6px #F08A3C}
.av[data-frame="cloud"]{box-shadow:0 0 0 3px var(--sky),0 0 10px 4px #DDF0FF}

/* screens */
main{flex:1}
.screen{display:flex;flex-direction:column;gap:18px;padding-block:16px 24px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
.rain{background:linear-gradient(90deg,#5BC97F,#3FB4F0 35%,#FF9B3D 60%,#A07CF0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:17px;border-radius:16px;padding:12px 18px;background:var(--pink);color:#fff;
  box-shadow:0 4px 0 #D9478A;transition:transform .08s}
.btn{touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D9478A}
.btn.alt{background:var(--lav);box-shadow:0 4px 0 #7F62C9}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 #43A882}
.btn.ghost{background:var(--bg);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn small{font-family:var(--body);font-size:12px;opacity:.9;display:block}
.tag{display:inline-block;font-family:var(--display);font-size:11px;border-radius:999px;padding:2px 8px;color:#fff;background:var(--pink)}

/* event banner */
.event{position:relative;overflow:hidden;border-radius:22px;padding:18px 16px 14px;background:#6E1F2E;color:#FFF3E6}
.event::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,180,90,.35),transparent 45%);pointer-events:none}
.event .t1{font-family:var(--display);font-size:15px;color:#FFB4B4}
.event .t2{font-family:var(--display);font-size:30px;color:#FF5E5E;text-shadow:0 2px 0 #fff;line-height:1.1}
.event .t3{font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.event .dolls{display:flex;gap:2px;margin-top:10px}
.event .dolls svg{width:56px;height:56px}

/* bubble trip */
.sky{position:relative;height:300px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#9FD8FF,#D9F0FF 70%,#CFF2C8 70%,#B9E8A6)}
.cloudbg{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.25) 22%,rgba(200,235,255,.25) 60%,rgba(255,200,240,.45));
  box-shadow:inset 0 0 12px rgba(255,255,255,.9),0 0 0 2px rgba(255,255,255,.7);display:grid;place-items:center;animation:float 5s ease-in-out infinite}
.bub svg,.bub img{width:68%;height:68%;object-fit:contain}
.bub.big{width:150px;height:150px;left:calc(50% - 75px);top:26px}
.bub.big.ready{cursor:pointer;animation:float 2.4s ease-in-out infinite,glow 1.2s ease-in-out infinite alternate}
.bub.s1{width:72px;height:72px;left:18px;top:150px;animation-delay:-1.5s}
.bub.s2{width:84px;height:84px;right:16px;top:132px;animation-delay:-3s}
.blower{position:absolute;left:30%;bottom:6px;width:70px;height:70px}
.skylabel{position:absolute;left:0;right:0;bottom:12px;text-align:center}
.skylabel .pill{display:inline-block;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 14px;font-family:var(--display);font-variant-numeric:tabular-nums}
.pop{animation:popit .45s ease-out forwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{from{box-shadow:inset 0 0 12px #fff,0 0 0 3px #fff,0 0 14px 4px rgba(255,111,174,.35)}to{box-shadow:inset 0 0 12px #fff,0 0 0 3px #fff,0 0 26px 10px rgba(255,111,174,.6)}}
@keyframes popit{to{transform:scale(1.6);opacity:0}}

/* character tiles */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.tile .pic{width:100%;aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.tile .pic svg,.tile .pic img{width:86%;height:86%;object-fit:contain}
.tile .nm{font-size:13px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .new{position:absolute;left:8px;top:6px;font-family:var(--display);font-size:12px;color:var(--pink)}
.tile .cnt{position:absolute;right:6px;top:6px;min-width:22px;height:22px;border-radius:999px;background:var(--pink);color:#fff;font-family:var(--display);font-size:13px;display:grid;place-items:center;padding:0 5px}
.tile .rb{font-family:var(--display);font-size:11px;border-radius:999px;padding:1px 8px;color:#fff}
.tile:has(svg[data-r="G"]){border:3px solid transparent;background:linear-gradient(180deg,#FFFDF0,#FFF1C9) padding-box,conic-gradient(from 30deg,#FFD45E,#FF8FC0,#A98BF2,#8CCBF5,#6FD3AA,#FFD45E) border-box;border-radius:30px 10px 30px 10px;box-shadow:0 4px 14px rgba(224,164,30,.35)}
.tile:has(svg[data-sp]){border:3px solid transparent;background:linear-gradient(180deg,#FFF5FB,#F3ECFF) padding-box,linear-gradient(135deg,#FF8FC0,#A98BF2,#8CCBF5) border-box;border-radius:44px 44px 14px 14px}
.tile:has(svg[data-r="G"])::after,.tile:has(svg[data-sp])::after{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:11px;letter-spacing:.06em;color:#fff;padding:1px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.tile:has(svg[data-r="G"])::after{content:"LEGEND";background:linear-gradient(90deg,#E0A41E,#FF6FAE,#A98BF2)}
.tile:has(svg[data-sp])::after{content:"SPECIAL";background:linear-gradient(90deg,#FF6FAE,#A98BF2)}
.tile.sel{outline:3px solid var(--pink);outline-offset:2px}
.grid,.ten,.pickup{padding-top:6px}
.tile.locked .pic{filter:brightness(0) opacity(.12)}
.tile.locked .nm{color:var(--muted)}
.tile.sel{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}

/* gacha */
.machine{position:relative;border-radius:26px;padding:18px 16px;background:linear-gradient(180deg,#FFF7C9,#FFE6F1);border:2px solid #FFD1E6;display:flex;flex-direction:column;gap:14px}
.odds{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.odds span{background:#fff;border-radius:999px;padding:3px 9px}
.pickup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pulls{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border-radius:14px 14px 0 0;padding:9px 16px;background:#EEE6F3;font-family:var(--display);font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 -2px 0 var(--pink) inset}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.item .art{position:relative;width:84px;height:84px;display:grid;place-items:center}
.item .art svg{width:100%;height:100%}
.item .price{display:flex;align-items:center;gap:4px;font-family:var(--display);font-variant-numeric:tabular-nums}
.item button{width:100%}

/* trade */
.trade{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
.trade .who{display:flex;align-items:center;gap:8px}
.trade .who .av{width:36px;height:36px}
.swap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.swap .side{background:var(--bg);border-radius:16px;padding:8px;text-align:center;min-width:0}
.swap .side .pic{width:76px;height:76px;margin:0 auto}
.swap .side .pic svg,.swap .side .pic img{width:100%;height:100%;object-fit:contain}
.swap .side small{display:block;color:var(--muted);font-size:12px}
.swap .side .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{display:flex;justify-content:center;gap:2px;margin-top:4px}
.plus span{width:30px;height:30px;border-radius:8px;background:#fff;box-shadow:0 0 0 2px var(--pink-soft)}
.plus span svg,.plus span img{width:100%;height:100%;object-fit:contain}
.arrow{font-family:var(--display);font-size:22px;color:var(--pink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.say{display:flex;gap:6px;flex-wrap:wrap}
.say button{background:var(--bg);border-radius:999px;padding:5px 10px;font-size:13px}
.speech{align-self:flex-start;background:var(--pink-soft);border-radius:16px 16px 16px 4px;padding:8px 12px;font-family:var(--display);font-size:16px}

/* forms */
label{font-family:var(--display);font-size:16px;display:block;margin-bottom:6px}
input[type=text],textarea,select{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:#FFFBFD;font:inherit;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.field{display:flex;flex-direction:column}
.upload{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}
.drop{position:relative;width:120px;height:120px;border:2px dashed var(--line);border-radius:18px;display:grid;place-items:center;background:#FFFBFD;overflow:hidden}
.drop img,.drop svg{width:88%;height:88%;object-fit:contain}
.drop .pen{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:9px;background:var(--pink);display:grid;place-items:center}
.hints{font-size:12.5px;color:var(--muted);margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pink)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{background:var(--bg);border-radius:12px;padding:7px 11px;font-size:13.5px}
.opts button[aria-pressed="true"]{background:var(--pink);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#EEE6F3;border-radius:14px;padding:4px}
.seg button{border-radius:11px;padding:9px;font-family:var(--display);font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* collection book covers */
.book{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:14px;background:var(--card);border:2px solid var(--line)}
.book[data-cover="milk"]{background:linear-gradient(180deg,#FFE4EE,#FFF7FA)}
.book[data-cover="night"]{background:linear-gradient(180deg,#2E2A5A,#5A4C8E);color:#fff}
.book[data-cover="night"] .sub{color:#CFC6F2}
.book[data-cover="hallo"]{background:linear-gradient(180deg,#5E1A28,#8A3A2A);color:#FFF1E2}
.book[data-cover="hallo"] .sub{color:#F8C9B0}
.book .tile{color:var(--ink)}
.setlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.setcard{display:flex;gap:8px;align-items:center;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:8px;text-align:left;min-width:0}
.sc-pic{width:44px;height:44px;flex:none}.sc-pic svg{width:100%;height:100%}.sc-pic.locked{filter:brightness(0) opacity(.15)}
.sc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.sc-t b{font-family:var(--display);font-weight:400;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sc-t small{color:var(--muted);font-size:12px}
.sc-t .progress{height:6px}
.progress{height:10px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav))}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-family:var(--display);font-size:13px;color:var(--muted)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--pink)}

/* modal + toast */
.veil{position:fixed;inset:0;z-index:40;background:rgba(74,59,87,.45);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--card);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative}
.modal .x{position:absolute;right:12px;top:10px;width:36px;height:36px;font-size:24px;color:var(--muted)}
.reveal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.reveal .pic{width:190px;height:190px;max-width:100%;display:grid;place-items:center;border-radius:50%}
.reveal .pic svg,.reveal .pic img{width:84%;height:84%;object-fit:contain}
.reveal .story{color:var(--muted);font-size:14px;max-width:32ch}
.capsule{width:130px;height:130px;margin:30px auto;animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.ten{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ten .tile{padding:4px 2px;border-radius:12px}
.ten .tile .nm{font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;
  border-radius:999px;padding:10px 18px;font-size:14px;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s}
.empty{text-align:center;color:var(--muted);padding:20px 8px}
.hub{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hub button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 2px;font-family:var(--display);font-size:13px;min-width:0}
.hub .hi{width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.hub .hi svg{width:90%;height:90%}
.hub .cnt{position:absolute;right:6px;top:4px;min-width:20px;height:20px;border-radius:999px;background:var(--pink);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
.mailbtn[data-has="1"]{background:#DDF0FF;box-shadow:0 0 0 2px var(--sky)}
.wallet{flex-wrap:nowrap}
.me small{white-space:nowrap}
@media (max-width:430px){.wallet{gap:4px}.wallet .chip{padding:4px 7px 4px 5px;font-size:13px}.me small{display:none}}

/* party */
.members{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mem{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.mem .av{width:54px;height:54px}
.mem b{font-family:var(--display);font-weight:400;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mem small{color:var(--muted);font-size:11.5px}
.role{font-family:var(--display);font-size:10.5px;border-radius:999px;padding:1px 7px;color:#fff;background:var(--sky)}
.role.op{background:#F08A3C}.role.me{background:var(--pink)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.feed li{background:var(--bg);border-radius:12px;padding:7px 10px;font-size:13.5px}
.feed li time{color:var(--muted);font-size:11.5px;margin-left:6px;font-variant-numeric:tabular-nums}
.notice{background:#FFF6D6;border:2px solid #FFE08A;border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.notice b{font-family:var(--display);font-weight:400;color:#C9861A;flex:none}
.evchips{display:flex;gap:6px;flex-wrap:wrap}
.evchip{background:var(--lav);color:#fff;border-radius:999px;padding:5px 11px;font-family:var(--display);font-size:13.5px;font-variant-numeric:tabular-nums}
.oppanel{background:#FFF1E4;border:2px solid #FFD2AE;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px}
.oppanel h3{color:#C9661A}
.game{position:relative;height:300px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#BFE6FF,#EAF7FF);touch-action:manipulation;user-select:none}
.game .gb{position:absolute;width:58px;height:58px;border-radius:50%;padding:6px;background:radial-gradient(circle at 30% 28%,#fff 0 10%,rgba(255,255,255,.3) 25%,rgba(255,200,240,.45));box-shadow:inset 0 0 10px #fff,0 0 0 2px rgba(255,255,255,.8)}
.game .gb svg{width:100%;height:100%}
.game .gb.gold{box-shadow:inset 0 0 10px #fff,0 0 0 3px var(--lemon),0 0 12px 3px rgba(255,212,94,.7)}
.game .hud{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;pointer-events:none}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 10px;font-variant-numeric:tabular-nums}
.rank li .av{width:30px;height:30px}

const EYE_L=['dot','happy','dot','happy','star','dot','spiral','angry','x','button'],MOUTH_L=['w','o','smile'];
const GEN_TOTAL=2000;
(function genMalang(){
  let need=GEN_TOTAL-BASE.length,k=0;
  for(const [id,name,pal,nouns,adjs] of THEMES){
    if(need<=0)break;
    const P=pal.split(' '),N=nouns.split(' ').map(x=>x.split(':')),A=adjs.split(' ');
    SETS.splice(SETS.findIndex(s=>s.id==='legend'),0,{id,name,note:`${name} 테마 친구들`});
    for(let ai=0;ai<A.length&&need>0;ai++)for(let ni=0;ni<N.length&&need>0;ni++){
      const r=seeded(hash(id+ai+'-'+ni)),roll=r()*100;
      const rar=roll<1?'G':roll<6?'U':roll<18?'E':roll<45?'R':'N';
      const [nn,shape,acc]=N[ni];
      BASE.push({id:'q'+(++k),name:`${A[ai]} ${nn}`,set:id,rar,shape,color:P[(ai+ni)%P.length],
        eyes:rar==='G'||rar==='U'?'star':EYE_L[Math.floor(r()*EYE_L.length)],mouth:MOUTH_L[Math.floor(r()*3)],
        acc:rar==='G'?'crown':acc==='none'&&r()<.3?['bow','star','leaf','heart'][Math.floor(r()*4)]:acc,story:STORY[Math.floor(r()*STORY.length)](name)});
      need--}
  }
})();

function relKey(){return dayKey(new Date(Date.now()-15*3600000))} // new lineup every day at 3 PM
function pickupIds(){const pool=gachaPool().filter(c=>c.set!=='custom'&&c.rar!=='G');
  const h=hash(relKey());const out=[];for(let i=0;out.length<3&&i<50;i++){const c=pool[(h+i*7919)%pool.length];if(!out.includes(c.id))out.push(c.id)}return out}
const GACHA_SETS=SETS.map(s=>s.id).filter(id=>!NOGACHA.includes(id));
function gachaPool(){return allChars().filter(c=>c.rar!=='L'&&(GACHA_SETS.includes(c.set)||(c.set==='hallo'&&eventOn())))}
function drawOne(){
  const pool=gachaPool(),w={N:RAR.N.w,R:RAR.R.w,E:RAR.E.w,U:RAR.U.w*(evOn('uniqueUp')?2:1),G:RAR.G.w};
  let r=Math.random()*Object.values(w).reduce((a,b)=>a+b,0),rar='N';for(const k of ['G','U','E','R','N']){if(r<w[k]){rar=k;break}r-=w[k]}
  let cand=pool.filter(c=>c.rar===rar);if(!cand.length)cand=pool;
  const pk=pickupIds().filter(id=>cand.some(c=>c.id===id));
  const c=(pk.length&&Math.random()<.35)?byId(pk[Math.floor(Math.random()*pk.length)]):cand[Math.floor(Math.random()*cand.length)];
  return c}
function pay(n){ // tickets first, then jelly at 100 each
  const useT=Math.min(S.tickets,n),need=(n-useT)*(n===10&&useT===0?90:100);
  if(S.jelly<need){toast('팝이 부족해요. 비눗방울 선물이나 상점에서 모아 보세요');return false}
  S.tickets-=useT;S.jelly-=need;return true}
function pull(n){
  if(!pay(n))return;
  const got=[];for(let i=0;i<n;i++){const c=drawOne();const isNew=!S.owned[c.id];gain(c.id);got.push({c,isNew})}
  qInc('pull',n);save();renderTop();
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  openModal(`<div class="reveal"><svg class="capsule" viewBox="0 0 100 100"><path d="M10 50 A40 40 0 0 1 90 50 Z" fill="#FF8FC0"/><path d="M10 50 A40 40 0 0 0 90 50 Z" fill="#fff" stroke="#F2D8E8" stroke-width="2"/><rect x="8" y="46" width="84" height="8" rx="4" fill="#A98BF2"/><circle cx="34" cy="30" r="6" fill="#fff" opacity=".7"/></svg><p class="sub">두근두근…</p></div>`);

        <div class="row" style="justify-content:center"><button class="btn" data-pull="1">한 번 더 뽑기</button><button class="btn ghost" data-close>확인</button></div></div>`;
    }else{
      $('#modal').innerHTML=`<button class="x" data-close aria-label="닫기">×</button><h2>10연속 뽑기 결과</h2>
        <div class="ten">${got.map(g=>`<div class="tile" style="border-color:${RAR[g.c.rar].c}">${g.isNew?'<span class="new">New</span>':''}<span class="pic">${charSVG(g.c)}</span><span class="nm">${esc(g.c.name)}</span></div>`).join('')}</div>
        <p class="sub">새로 만난 친구 ${got.filter(g=>g.isNew).length}명 · 유니크 ${got.filter(g=>g.c.rar==='U').length}명</p><button class="btn ghost" data-close>확인</button>`;

/* ---------- trade ---------- */
function tradable(){return Object.keys(S.owned).filter(id=>S.owned[id]>0&&byId(id))}
// how much friend i would pay for c, and how much they want to keep their own c
function wantVal(i,c){const f=FRIENDS[i],a=S.ai[i];let v=VAL[c.rar]*(a.owned[c.id]?1:(f.tier==='new'?1.6:1.3));if(f.fav&&c.set===f.fav)v*=2;return v}
function holdVal(i,c){const f=FRIENDS[i],a=S.ai[i],n=a.owned[c.id]||0;let v=VAL[c.rar]*TIERS[f.tier].greed;if(n===1)v*=1.3;if(n>2)v*=.8;if(f.fav&&c.set===f.fav)v*=2;return v}
function makeTrade(fi){
  const mine=tradable();if(!mine.length)return null;
  const a=S.ai[fi],f=FRIENDS[fi];
  let wish=mine.filter(id=>!a.owned[id]);if(f.fav){const fv=wish.filter(id=>byId(id).set===f.fav);if(fv.length)wish=fv}if(!wish.length)wish=mine;
  const dups=wish.filter(id=>S.owned[id]>1);const list=dups.length&&Math.random()<.7?dups:wish;
  const want=list[Math.floor(Math.random()*list.length)],wv=wantVal(fi,byId(want));
  const theirs=Object.keys(a.owned).filter(id=>a.owned[id]>0&&id!==want&&byId(id)).map(byId);
  let ok=theirs.filter(c=>holdVal(fi,c)<=wv*1.05).sort((x,y)=>holdVal(fi,y)-holdVal(fi,x));
  if(!ok.length)return null;
  const unseen=ok.filter(c=>!S.owned[c.id]);if(unseen.length&&Math.random()<.6)ok=unseen;
  const give=ok[Math.floor(Math.random()*Math.min(3,ok.length))];
  return{f:fi,want,give:give.id,said:''}}
function ensureTrades(){
  S.trades=(S.trades||[]).filter(t=>t&&FRIENDS[t.f]&&byId(t.want)&&byId(t.give)&&(S.owned[t.want]||0)>0&&(S.ai[t.f].owned[t.give]||0)>0);
  for(let tries=0;S.trades.length<4&&tries<30;tries++){const fi=Math.floor(Math.random()*FRIENDS.length);if(S.trades.some(t=>t.f===fi))continue;const t=makeTrade(fi);if(t)S.trades.push(t)}
  save()}

      <div class="tabs" role="tablist">${[['all','ALL']].concat(sets.map(s=>[s.id,s.name])).map(([id,n])=>`<button role="tab" aria-selected="${bookSet===id}" data-bookset="${id}">${n}</button>`).join('')}</div>
      ${overview}${list.map(s=>{const cs=all.filter(c=>c.set===s.id),h=cs.filter(c=>S.owned[c.id]).length;
        return`<div style="display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between"><h3>${esc(s.name)}</h3><span class="sub" style="margin:0">${h} / ${cs.length}</span></div>
        <p class="sub" style="margin-top:-6px">${esc(s.note)}${s.limited&&!eventOn()?' (이벤트 종료)':''}</p>

function itemArt(it,kind){
  if(kind==='profile')return`<span class="av" data-frame="${it.frame}" style="width:70px;height:70px">${charSVG(byId(S.avatar)||BASE[0])}</span>`;
  if(kind==='book')return`<div class="book" data-cover="${it.cover}" style="width:70px;height:84px;padding:6px;border-radius:12px;display:grid;place-items:center">${charSVG(BASE[hash(it.cover)%BASE.length])}</div>`;
  if(kind==='emo')return`<div style="font-family:var(--display);font-size:17px;line-height:1.25;color:var(--lav);text-align:center">${it.words.map(esc).join('<br>')}</div>`;
  const tk='<rect x="18" y="30" width="64" height="40" rx="10" fill="#A98BF2"/><circle cx="50" cy="50" r="10" fill="#fff"/><circle cx="18" cy="50" r="7" fill="#fff"/><circle cx="82" cy="50" r="7" fill="#fff"/>';
  if(it.art==='tickets')return`<svg viewBox="0 0 100 100"><g transform="translate(-8 -10)" opacity=".55">${tk}</g>${tk}</svg>`;
  if(it.art==='ticket')return`<svg viewBox="0 0 100 100">${tk}</svg>`;
  if(kind==='sky')return`<div style="width:84px;height:64px;border-radius:12px;background:${it.bg};display:grid;place-items:center"><span style="width:34px;height:34px">${charSVG(BASE[0])}</span></div>`;
  if(it.art==='pop')return POP_IC.replace('class="ic"','width="64" height="64"');
  if(it.art==='box'){const pool=boxPool(it.box),c=pool[hash(it.id)%pool.length]||BASE[0];return`<svg viewBox="0 0 100 100"><rect x="18" y="38" width="64" height="48" rx="8" fill="#FFC1DA" stroke="#FF6FAE" stroke-width="3"/><rect x="12" y="28" width="76" height="16" rx="6" fill="#FF8FC0" stroke="#FF6FAE" stroke-width="3"/><rect x="45" y="28" width="10" height="58" fill="#FFD45E"/></svg><span style="position:absolute;width:40px;height:40px;margin-top:-6px">${charSVG(c)}</span>`}
  return`<svg viewBox="0 0 100 100"><rect x="20" y="22" width="60" height="58" rx="16" fill="#FF8FC0"/><rect x="20" y="22" width="30" height="29" rx="12" fill="#FFD45E"/><rect x="50" y="51" width="30" height="29" rx="12" fill="#6FD3AA"/><circle cx="34" cy="34" r="5" fill="#fff"/></svg>`}
function shopHTML(){
  const kinds=[['jelly','큐브·뽑기권'],['box','말랑이 상자'],['roulette','룰렛'],['profile','프로필'],['book','콜북'],['sky','하늘 꾸미기'],['emo','이모티콘']];
  const items=SHOP[shopTab]||[];
  return`<section class="screen wrap">
    <div><h2><span style="color:var(--pink)">누구나 콜북&이모티콘</span> <span class="rain">상점</span></h2><p class="sub">팝으로 뽑기권을, 큐브로 프로필·콜북·이모티콘을 사요. 큐브는 출석, 퀘스트, 룰렛, 매일 무료로 모아요.</p></div>
    <div><div class="tabs" role="tablist">${kinds.map(([id,n])=>`<button role="tab" aria-selected="${shopTab===id}" data-shoptab="${id}">${n}</button>`).join('')}</div>
    ${shopTab==='roulette'?rouletteHTML():''}<div class="shopgrid" style="background:var(--card);border-radius:0 18px 18px 18px;padding:10px" ${shopTab==='roulette'?'hidden':''}>${items.map(it=>{
      const owned=S.shop.includes(it.id)||(it.sky==='day'),inUse=(shopTab==='profile'&&S.frame===it.frame)||(shopTab==='book'&&S.cover===it.cover)||(shopTab==='sky'&&(S.sky||'day')===it.sky);
      let act;
      if(it.daily){const done=S.lastDaily===today();act=`<button class="btn mint" data-buy="${it.id}" ${done?'disabled':''}>${done?'내일 또 받아요':'무료로 받기'}</button>`}
      else if(shopTab==='jelly'||shopTab==='box')act=`<button class="btn" data-buy="${it.id}">${it.box?'열기':'사기'}</button>`;
      else if(shopTab==='sky'&&inUse)act='<button class="btn ghost" disabled>사용 중</button>';
      else if(owned&&shopTab==='emo')act='<button class="btn ghost" disabled>보유 중</button>';
      else if(owned)act=`<button class="btn ${inUse?'ghost':'alt'}" data-use="${it.id}">${inUse?'사용 해제':'사용하기'}</button>`;
      else act=`<button class="btn" data-buy="${it.id}">사기</button>`;
      return`<div class="item">${it.isNew?'<span class="tag">New</span>':''}<b style="font-family:var(--display);font-weight:400;font-size:15px">${esc(it.name)}</b>
        <div class="art">${itemArt(it,shopTab)}</div>${it.desc?`<span class="sub" style="margin:0">${it.desc}</span>`:''}
        <span class="price">${it.price?(it.cur==='pop'?POP_IC:CUBE_IC):''}${it.price||'무료'}</span>${act}</div>`}).join('')}</div></div>

  const pick=(obj,key)=>`<div class="opts">${Object.entries(obj).map(([k,v])=>`<button aria-pressed="${M[key]===k}" data-mk="${key}" data-val="${k}">${v}</button>`).join('')}</div>`;
  return`<section class="screen wrap">
    <div><h2><span style="color:var(--pink)">내 손으로 직접</span> <span class="rain">말랑이 만들기</span></h2><p class="sub">만든 말랑이는 내 콜북에 들어가고, 뽑기에서도 레어로 나와요.</p></div>
    <form class="panel" id="makeForm" style="display:flex;flex-direction:column;gap:16px">
      <div class="seg"><button type="button" aria-pressed="${M.mode==='draw'}" data-mode="draw">꾸며서 만들기</button><button type="button" aria-pressed="${M.mode==='img'}" data-mode="img">이미지 올리기</button></div>
      <div class="field"><label>말랑이 이미지</label>
        <div class="upload"><div class="drop">${prev}${M.mode==='img'?`<label class="pen" for="mkFile" aria-label="이미지 고르기" style="margin:0"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M4 16 L5 12 L13 4 L16 7 L8 15 Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></label>`:''}</div>
        ${M.mode==='img'?`<ul class="hints"><li>이미지를 첨부해 주세요</li><li>투명 배경의 PNG 파일</li><li>파일 크기 5MB 이하</li><li><button type="button" data-mode="draw" style="text-decoration:underline;color:var(--muted);font-size:12.5px;padding:0">꾸며서 말랑이를 만들고 싶나요?</button></li></ul><input type="file" id="mkFile" accept="image/png" hidden>`
        :`<div style="display:flex;flex-direction:column;gap:8px;min-width:0"><span class="sub" style="margin:0">몸 색깔</span><div class="swatches">${PALETTE.map(p=>`<button type="button" aria-label="색 ${p}" aria-pressed="${M.color===p}" data-mk="color" data-val="${p}" style="background:${p}"></button>`).join('')}</div></div>`}</div></div>
      ${M.mode==='draw'?`<div class="field"><label>모양</label>${pick(SHAPES,'shape')}</div><div class="field"><label>눈</label>${pick(EYES,'eyes')}</div><div class="field"><label>입</label>${pick(MOUTHS,'mouth')}</div><div class="field"><label>꾸미기</label>${pick(ACCS,'acc')}</div>`:''}

      <div class="field"><label for="mkStory">담긴 이야기</label><textarea id="mkStory" maxlength="80" placeholder="수십만 명의 유저들에게 사랑받는 말랑이가 될 거예요. 모두가 모으고 싶어할 만큼요!"></textarea></div>
      <div class="field"><label for="mkMaker">제작자 닉네임</label><input type="text" id="mkMaker" maxlength="16" value="${esc(S.nick)}"></div>
      <button class="btn" type="submit">말랑이 제출하기</button>
    </form>
    ${S.custom.length?`<div class="panel" style="display:flex;flex-direction:column;gap:10px"><h3>내가 만든 말랑이</h3><div class="grid">${S.custom.map(c=>tile(c,{hideCount:true})).join('')}</div>
      <p class="sub" style="margin:0">말랑이를 누르면 자세히 볼 수 있어요.</p></div>`:''}
  </section>`}

function render(){
  renderTop();renderNav();
  const m=$('#main');
  m.innerHTML={home:homeHTML,gacha:gachaHTML,book:bookHTML,party:partyHTML,shop:shopHTML,make:makeHTML}[tab]();
  const f=$('#mkFile');if(f)f.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;
    if(file.type!=='image/png'){toast('PNG 파일만 올릴 수 있어요');return}
    if(file.size>5*1024*1024){toast('5MB 이하 파일만 올릴 수 있어요');return}
    const keep=formVals();shrinkImage(file,url=>{MAKER.img=url;render();restoreForm(keep)})});
  const form=$('#makeForm');if(form)form.addEventListener('submit',submitMake);
}
function formVals(){return['mkName','mkStory','mkMaker'].map(id=>($('#'+id)||{}).value)}
function restoreForm(v){['mkName','mkStory','mkMaker'].forEach((id,i)=>{const el=$('#'+id);if(el&&v[i]!=null)el.value=v[i]})}
function submitMake(e){
  e.preventDefault();
  const name=$('#mkName').value.trim(),story=$('#mkStory').value.trim(),maker=$('#mkMaker').value.trim()||S.nick;
  if(!name){toast('말랑이 이름을 지어 주세요');return}
  if(MAKER.mode==='img'&&!MAKER.img){toast('PNG 이미지를 먼저 골라 주세요');return}
  const c={id:'c'+Date.now().toString(36),name,set:'custom',rar:'R',story:story||'세상에 하나뿐인 말랑이예요.',maker};
  if(MAKER.mode==='img')c.img=MAKER.img;else Object.assign(c,{shape:MAKER.shape,color:MAKER.color,eyes:MAKER.eyes,mouth:MAKER.mouth,acc:MAKER.acc});
  S.custom.push(c);gain(c.id);MAKER.img='';save();render();
  openModal(`<div class="reveal"><span class="pic" style="background:var(--pink-soft)">${charSVG(c)}</span><span class="tag">제출 완료</span><h2>${esc(c.name)}</h2><p class="story">${esc(c.story)}</p><p class="sub">제작자 ${esc(maker)} · 이제 뽑기에서도 나와요</p><button class="btn" data-close>좋아요</button></div>`)}

/* ---------- party: AI friends, feed, mini game, operator ---------- */
const nowT=()=>{const d=new Date();return`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
function log(txt){S.feed.unshift({t:nowT(),txt});S.feed=S.feed.slice(0,30)}
function aiCount(i){return Object.keys(S.ai[i].owned).length}
function aiAct(){
  const i=Math.floor(Math.random()*FRIENDS.length),f=FRIENDS[i],a=S.ai[i],r=Math.random();
  if(f.tier==='rich'&&r<.12){const best=Object.keys(a.owned).map(byId).filter(c=>c&&(c.rar==='G'||c.rar==='L'));if(best.length){log(`부자 ${f.name}님이 ${best[Math.floor(Math.random()*best.length)].name}을(를) 자랑해요`);return}}
  if(r>.85&&r<.9){const j=Math.floor(Math.random()*FRIENDS.length),g=FRIENDS[j];if(j!==i){log(`${f.name}님과 ${g.name}님이 거래를 했어요`);return}}
  if(r<.55){const c=drawOne();const isNew=!a.owned[c.id];a.owned[c.id]=(a.owned[c.id]||0)+1;
    log(`${f.name}님이 ${c.name}${c.rar==='U'?' (유니크!)':''}을(를) 뽑았어요${isNew?'':' (중복)'}`)}
  else if(r<.75){const bset=BASE.filter(x=>x.set==='bubble'),c=bset[Math.floor(Math.random()*bset.length)];
    if(Math.random()<.4){a.owned[c.id]=(a.owned[c.id]||0)+1;log(`${f.name}님 비눗방울에서 ${c.name}이(가) 나왔어요`)}else log(`${f.name}님이 비눗방울을 터뜨려 팝을 받았어요`)}
  else if(r<.9){const sc=20+Math.floor(Math.random()*(i===2?35:25));a.score=Math.max(a.score,sc+({new:-8,normal:0,pro:10,rich:4,collector:2}[f.tier]));log(`${f.name}님이 방울 터뜨리기에서 ${sc}점을 냈어요`)}
  else{const words=['같이 뽑기 하자!','저주인형즈 너무 귀여워','거래할 사람~','오늘 픽업 뭐야?'];log(`${f.name}: "${words[Math.floor(Math.random()*words.length)]}"`)}}
(function catchUp(){const n=Math.min(6,Math.floor((Date.now()-S.aiTick)/60000));for(let k=0;k<n;k++)aiAct();S.aiTick=Date.now();save()})();
setInterval(()=>{aiAct();S.aiTick=Date.now();save();if(tab==='party'){const f=$('#feed');if(f)f.innerHTML=feedHTML();const m=$('#members');if(m)m.innerHTML=membersHTML()}},20000);

function feedHTML(){return S.feed.length?S.feed.map(e=>`<li>${esc(e.txt)}<time>${e.t}</time></li>`).join(''):'<li>아직 조용해요. 곧 친구들이 움직일 거예요.</li>'}
function membersHTML(){
  const me=`<div class="mem">${avHTML(S.avatar,S.frame)}<b>${esc(S.nick)}</b><span class="role me">나</span><small>도감 ${allChars().filter(c=>S.owned[c.id]).length}</small></div>`;
  const ais=PARTY.map(i=>{const f=FRIENDS[i];return`<div class="mem">${avHTML(f.av)}<b>${f.name}</b>${tierChip(f)}<small>도감 ${aiCount(i)}</small></div>`}).join('');

function tradeCards(){
  ensureTrades();

  if(!S.trades.length)return'<div class="panel empty">거래할 말랑이가 아직 없어요. 뽑기를 먼저 해 보세요.</div>';
  return S.trades.map((t,i)=>{const f=FRIENDS[t.f],w=byId(t.want),g=byId(t.give),last=S.owned[t.want]===1;

      <div class="acts" style="grid-template-columns:1fr 1fr 1fr"><button class="btn ghost" data-decline="${i}" aria-label="거절" style="color:var(--red)">✕ 거절</button><button class="btn ghost" data-tplus="${i}" ${(t.asks||0)>=2||t.done?'disabled':''} style="color:#3FA3E0">+ 더 줘</button><button class="btn mint" data-accept="${i}">✓ 교환</button></div></div>`}).join('')}

function rankHTML(){

const VAL={N:1,R:3,E:5,U:8,G:14,L:15};const TRADE_POP=30;
let TP={f:0,want:[],give:[],jelly:0,said:''};
const TPMAX={give:4,want:3};
function tpTile(c,kind,n){const on=TP[kind].includes(c.id);
  return`<button class="tile${on?' sel':''}" data-tp${kind==='give'?'g':'w'}="${c.id}">${n>1?`<span class="cnt">${n}</span>`:''}<span class="pic">${charSVG(c)}</span><span class="nm">${esc(c.name)}</span><span class="rb" style="background:${RAR[c.rar].c}">${RAR[c.rar].name}</span></button>`}

function proposeHTML(){

  const mine=allChars().filter(c=>S.owned[c.id]).sort((x,y)=>RORDER.indexOf(y.rar)-RORDER.indexOf(x.rar));
  const offer=TP.give.reduce((s,id)=>s+wantVal(fi,byId(id)),0)+TP.jelly/50,ask=TP.want.reduce((s,id)=>s+holdVal(fi,byId(id)),0);
  const pct=ask?Math.min(100,Math.round(offer/ask*100)):0;
  return`<h2>내가 거래 걸기</h2>

function sendProposal(){
  const a=S.ai[TP.f],f=FRIENDS[TP.f],fi=TP.f,W=TP.want.map(byId),G=TP.give.map(byId);TP.suggest=null;
  if(!W.length||W.some(w=>!(a.owned[w.id]>0))||G.some(g=>!(S.owned[g.id]>0)))return;
  if(TP.jelly>S.jelly){TP.said='팝이 모자란 것 같아요!';return}
  if(G.some(g=>TP.want.includes(g.id))){TP.said='똑같은 말랑이를 주고받으면 이상하잖아요~';return}
  const offer=G.reduce((s,g)=>s+wantVal(fi,g),0)+TP.jelly/50,ask=W.reduce((s,w)=>s+holdVal(fi,w),0);
  if(offer>=ask){
    W.forEach(w=>{a.owned[w.id]--;if(!a.owned[w.id])delete a.owned[w.id]});G.forEach(g=>{a.owned[g.id]=(a.owned[g.id]||0)+1;S.owned[g.id]--;if(!S.owned[g.id])delete S.owned[g.id]});
    const news=W.filter(w=>!S.owned[w.id]).length;W.forEach(w=>gain(w.id));S.jelly-=TP.jelly;S.jelly+=TRADE_POP;qInc('trade');
    log(`${S.nick}님과 ${f.name}님이 ${G.map(g=>g.name).join('+')||'팝'} ⇄ ${W.map(w=>w.name).join('+')} 거래를 했어요`);save();renderTop();
    TP={f:fi,want:[],give:[],jelly:0,said:''};
    $('#modal').innerHTML=`<button class="x" data-close aria-label="닫기">×</button><div class="reveal"><div class="plus" style="gap:6px">${W.map(w=>`<span style="width:${W.length>1?84:150}px;height:${W.length>1?84:150}px;background:none;box-shadow:none">${charSVG(w)}</span>`).join('')}</div><span class="tag" style="background:var(--mint)">거래 성공${news?` · NEW ${news}`:''}</span><h2>${W.map(w=>esc(w.name)).join(', ')}</h2><p class="story">${f.name}: "좋아요, 바꿔요!" 팝 +${TRADE_POP}</p><button class="btn" data-close>확인</button></div>`;
  }else{
    const gap=ask-offer;
    const cands=allChars().filter(c=>S.owned[c.id]&&!TP.give.includes(c.id)&&!TP.want.includes(c.id)).sort((x,y)=>wantVal(fi,x)-wantVal(fi,y));
    const fit=cands.find(c=>wantVal(fi,c)>=gap);
    if(fit&&TP.give.length<TPMAX.give&&gap<=8){TP.suggest=fit.id;TP.said=`${fit.name}도 같이 주면 바꿀게요!`}
    else TP.said=f.tier==='rich'&&W.some(w=>w.rar==='G')?'LEGEND는 아무한테나 안 줘요. 정말 귀한 걸 가져와요!':gap<=1?'음… 팝을 조금만 더 얹어 주면 바꿀게요!':'그건 너무 아까워요. 더 얹어 주면 생각해 볼게요.';
  }
}

/* ---------- gift codes (work across phones without a server) ---------- */
const CODE_SALT='malang-family';
function codeSum(body){return(hash(body+CODE_SALT)%1296).toString(36).toUpperCase().padStart(2,'0')}
function makeCode(give){
  const t=give.c?'C':give.j?'J':give.k?'K':give.t?'T':'Y',v=give.c?give.c.toUpperCase():String(give.j||give.k||give.t||give.y);
  const n=Math.random().toString(36).slice(2,6).toUpperCase(),body=`${t}${v}-${n}`;return`${body}-${codeSum(body)}`}
function readCode(raw){
  const m=String(raw).toUpperCase().replace(/\s/g,'').match(/^([CJKTY])([A-Z0-9]+)-([A-Z0-9]{4})-([A-Z0-9]{2})$/);if(!m)return null;
  const body=`${m[1]}${m[2]}-${m[3]}`;if(codeSum(body)!==m[4])return null;
  if(m[1]==='C'){const c=byId(m[2].toLowerCase());return c?{give:{c:c.id},n:m[3]}:null}
  const v=+m[2];if(!v||v>100000)return null;return{give:{[m[1].toLowerCase()]:v},n:m[3]}}

function boxPool(b){if(b==='any')return gachaPool();if(b==='epic')return BASE.filter(c=>['E','U','G'].includes(c.rar)&&GACHA_SETS.includes(c.set));return BASE.filter(c=>c.set===b&&c.rar!=='L')}

/* ---------- daily quests ---------- */
const QUESTS=[
  {k:'pull',n:3,name:'말랑이 3번 뽑기',give:{j:50}},
  {k:'bubble',n:1,name:'비눗방울 선물 받기',give:{j:50}},
  {k:'trade',n:1,name:'거래 1번 성공하기',give:{k:10}},
  {k:'adv',n:1,name:'모험 1번 다녀오기',give:{k:10}},
  {k:'game',n:1,name:'방울 터뜨리기 1판',give:{j:50}}
];
function qState(){if(S.q.day!==today())S.q={day:today(),prog:{},claimed:[],all:false};return S.q}
function qInc(k,n=1){const q=qState();q.prog[k]=(q.prog[k]||0)+n}
function qReady(){const q=qState();return QUESTS.filter((x,i)=>(q.prog[x.k]||0)>=x.n&&!q.claimed.includes(i)).length+(allQDone()&&!q.all?1:0)}
function allQDone(){const q=qState();return QUESTS.every((x,i)=>q.claimed.includes(i))}
function giveStr(g){return[g.j?`팝 ${g.j}`:'',g.k?`큐브 ${g.k}`:'',g.y?`사탕 ${g.y}`:'',g.t?`뽑기권 ${g.t}`:''].filter(Boolean).join(' + ')}
function grant(g){if(g.j)S.jelly+=g.j;if(g.k)S.cube+=g.k;if(g.y)S.candy+=g.y;if(g.t)S.tickets+=g.t}
function questHTML(){
  const q=qState(),bonus=eventOn()?{k:20,y:3}:{k:20};
  return`<h2>출석 · 일일 퀘스트</h2>
  <div><h3>5일 출석</h3><p class="sub">하루라도 빠지면 1일째로 돌아가요.</p></div>
  <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px">${ATT.map((r,i)=>`<div class="tile" style="${i<S.att.day?'border-color:var(--pink);background:var(--pink-soft)':''}"><b style="font-family:var(--display);font-weight:400;font-size:13px">${i+1}일</b><span style="font-size:11px">${giveStr(r)}</span>${i<S.att.day?'<span class="tag">받음</span>':''}</div>`).join('')}</div>
  <div><h3>오늘의 퀘스트</h3><p class="sub">자정에 새로 바뀌어요.</p></div>
  <div style="display:flex;flex-direction:column;gap:8px">${QUESTS.map((x,i)=>{const p=Math.min(q.prog[x.k]||0,x.n),done=p>=x.n,got=q.claimed.includes(i);
    return`<div class="mail"><div class="txt"><b style="font-family:var(--display);font-weight:400">${x.name}</b><small>${p} / ${x.n} · 보상 ${giveStr(x.give)}</small></div>
    <button class="btn ${got?'ghost':'mint'}" data-qclaim="${i}" ${done&&!got?'':'disabled'} style="font-size:14px;padding:8px 12px">${got?'받음':'받기'}</button></div>`}).join('')}
    <div class="mail" style="background:#FFF6D6"><div class="txt"><b style="font-family:var(--display);font-weight:400">모든 퀘스트 완료 보너스</b><small>${giveStr(bonus)}</small></div>
    <button class="btn alt" data-qall ${allQDone()&&!q.all?'':'disabled'} style="font-size:14px;padding:8px 12px">${q.all?'받음':'받기'}</button></div></div>`}

/* ---------- adventure race ---------- */
let ADV=null;
function advLeft(){if(S.advDay!==today()){S.advDay=today();S.advPlays=0}return 5-(S.advPlays||0)}
function advHTML(){
  return`<h2>모험 달리기</h2><p class="sub" style="margin:0">1등으로 도착하면 팝 60, 시간 안에 도착하면 팝 30${eventOn()?', 할로윈 사탕도 받아요':''}. 오늘 보상 ${Math.max(0,advLeft())}번 남음.</p>
  <div id="track" style="display:flex;flex-direction:column;gap:8px;background:linear-gradient(90deg,#D8F3C8,#BDE8A8);border-radius:18px;padding:10px;position:relative">
    ${[{n:S.nick,av:S.avatar}].concat(PARTY.map(i=>FRIENDS[i]).map(f=>({n:f.name,av:f.av}))).map((r,i)=>`<div style="position:relative;height:44px;background:rgba(255,255,255,.45);border-radius:12px">
      <span style="position:absolute;right:6px;top:0;bottom:0;width:6px;background:repeating-linear-gradient(0deg,#4A3B57 0 6px,#fff 6px 12px);border-radius:3px"></span>
      <span data-runner="${i}" style="position:absolute;left:0;top:2px;width:40px;height:40px;transition:left .1s linear">${charSVG(byId(r.av)||BASE[0])}</span>
      <span style="position:absolute;left:46px;top:12px;font-size:12px;color:var(--muted)">${esc(r.n)}</span></div>`).join('')}
  </div>
  <div class="row" style="justify-content:space-between"><span style="font-family:var(--display);font-size:18px">남은 시간 <span id="advT">20</span>초</span></div>
  <button class="btn" id="advBtn" data-advgo style="font-size:22px;padding:16px">출발!</button>`}
function advStart(){
  ADV={p:[0,0,0,0],sp:[0,.5+Math.random()*.15,.55+Math.random()*.15,.6+Math.random()*.15],fin:[],end:Date.now()+20000,t:null};
  const btn=$('#advBtn');btn.textContent='달려! (연타)';btn.removeAttribute('data-advgo');btn.dataset.advrun='';
  ADV.t=setInterval(()=>{if(!ADV)return;
    for(let i=1;i<4;i++){if(ADV.p[i]<100){ADV.p[i]=Math.min(100,ADV.p[i]+ADV.sp[i]*(0.6+Math.random()*0.8));if(ADV.p[i]>=100)ADV.fin.push(i)}}
    advDraw();const l=Math.ceil((ADV.end-Date.now())/1000);const t=$('#advT');if(t)t.textContent=Math.max(0,l);
    if(l<=0||ADV.fin.includes(0)&&ADV.fin.length>=1&&ADV.p.every(x=>x>=100))advEnd()},100)}
function advDraw(){document.querySelectorAll('[data-runner]').forEach(el=>{const i=+el.dataset.runner;el.style.left=`calc(${ADV.p[i]}% * .82)`})}
function advRun(){if(!ADV||ADV.p[0]>=100)return;ADV.p[0]=Math.min(100,ADV.p[0]+3.1);if(ADV.p[0]>=100){ADV.fin.push(0);setTimeout(advEnd,300)}advDraw()}
function advStop(){if(ADV){clearInterval(ADV.t);ADV=null}}
function advEnd(){
  if(!ADV)return;const fin=ADV.fin.slice(),place=fin.indexOf(0)+1;advStop();
  const rewarded=advLeft()>0,mult=evOn('jelly2')?2:1;let g={};
  if(place===1)g={j:60*mult,y:eventOn()?3:0};else if(place>0)g={j:30*mult,y:eventOn()?1:0};
  if(rewarded){grant(g);S.advPlays=(S.advPlays||0)+1}qInc('adv');
  log(`${S.nick}님이 모험에서 ${place?place+'등으로 도착했어요':'시간 안에 도착하지 못했어요'}`);save();renderTop();
  $('#modal').innerHTML=`<button class="x" data-close aria-label="닫기">×</button><div class="reveal"><h2>${place?place+'등 도착!':'아쉽게 시간 초과'}</h2>
    <p class="story">${rewarded?(giveStr(g)?giveStr(g)+'을 받았어요.':'보상은 없어요. 다시 도전해 봐요!'):'오늘 보상은 다 받았어요. 연습은 계속할 수 있어요.'}</p>
    <div class="row" style="justify-content:center"><button class="btn" data-hub="adv">다시 달리기</button><button class="btn ghost" data-close>닫기</button></div></div>`}

/* ---------- melo (combine) ---------- */
const RECIPES=[{need:['b1','b6','b4'],out:'m1'},{need:['b2','b8','s5'],out:'m2'},{need:['b9','b3','s2'],out:'m3'}];
function meloHTML(){
  const commons=allChars().filter(c=>c.rar==='N'&&(S.owned[c.id]||0)>=3);
  return`<h2>멜로 조합</h2><p class="sub" style="margin:0">레시피대로 말랑이를 넣으면 새 말랑이가 나와요. 넣은 재료는 사라져요.</p>
  ${RECIPES.map((r,i)=>{const o=byId(r.out),ok=r.need.every(id=>S.owned[id]>0);
    return`<div class="trade" style="gap:8px"><div class="row" style="justify-content:space-between"><h3>레시피 ${i+1}</h3><span class="tag" style="background:${RAR[o.rar].c}">${RAR[o.rar].name}</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto minmax(0,1fr);gap:4px;align-items:center">
      ${r.need.map(id=>{const c=byId(id);return`<div class="tile${S.owned[id]?'':' locked'}" style="padding:4px"><span class="pic">${charSVG(c)}</span><span class="nm" style="font-size:11px">${S.owned[id]?esc(c.name):'???'}</span></div>`}).join('')}
      <span class="arrow">=</span><div class="tile${S.owned[o.id]?'':' locked'}" style="padding:4px;border-color:${RAR[o.rar].c}"><span class="pic">${charSVG(o)}</span><span class="nm" style="font-size:11px">${S.owned[o.id]?esc(o.name):'???'}</span></div></div>
    <button class="btn ${ok?'':'ghost'}" data-combo="${i}" ${ok?'':'disabled'}>${ok?'조합하기':'재료가 모자라요'}</button></div>`}).join('')}
  <div class="trade" style="gap:8px"><h3>같은 COMMON 3개 → 랜덤 RARE</h3>
    ${commons.length?`<div class="grid">${commons.map(c=>`<button class="tile" data-combocommon="${c.id}"><span class="cnt">${S.owned[c.id]}</span><span class="pic">${charSVG(c)}</span><span class="nm">${esc(c.name)}</span></button>`).join('')}</div>`:'<p class="sub" style="margin:0">같은 COMMON 말랑이가 3개 이상 있어야 해요.</p>'}</div>`}
function useUp(id,n=1){S.owned[id]-=n;if(S.owned[id]<=0)delete S.owned[id]}
function showGot(c,title,extra=''){$('#modal').innerHTML=`<button class="x" data-close aria-label="닫기">×</button><div class="reveal"><span class="pic" style="background:radial-gradient(circle,${RAR[c.rar].c}55,transparent 70%)">${charSVG(c)}</span><span class="tag" style="background:${RAR[c.rar].c}">${title} · ${RAR[c.rar].name}</span><h2>${esc(c.name)}</h2><p class="story">${esc(c.story||'')}</p>${extra}<button class="btn" data-close>확인</button></div>`}

/* ---------- black hole ---------- */
let HOLE=null;
const HOLE_CH={N:2,R:4,E:7,U:12,G:20,L:0};
function holeHTML(){
  const mine=allChars().filter(c=>S.owned[c.id]&&c.id!=='l1');
  return`<h2>블랙홀</h2><p class="sub" style="margin:0">말랑이를 블랙홀에 넣으면 아주 낮은 확률로 LIMITED 별고래가 나와요. 등급이 높을수록 확률이 올라가요. 넣은 말랑이는 돌아오지 않아요.</p>
  <div style="height:120px;border-radius:18px;background:radial-gradient(circle,#000 0 18%,#2E2A5A 30%,#5A4C8E 55%,#BFA8F5 80%);display:grid;place-items:center"><span id="holeIn" style="width:56px;height:56px">${HOLE?charSVG(byId(HOLE)):''}</span></div>
  <div class="grid">${mine.map(c=>`<button class="tile${HOLE===c.id?' sel':''}" data-holepick="${c.id}">${S.owned[c.id]>1?`<span class="cnt">${S.owned[c.id]}</span>`:''}<span class="pic">${charSVG(c)}</span><span class="nm">${esc(c.name)}</span><span class="rb" style="background:${RAR[c.rar].c}">${HOLE_CH[c.rar]}%</span></button>`).join('')}</div>
  <button class="btn alt" data-holego ${HOLE?'':'disabled'}>${HOLE?`${esc(byId(HOLE).name)} 넣기`:'넣을 말랑이를 골라 주세요'}</button>`}
function holeGo(){
  const c=byId(HOLE);if(!c||!S.owned[c.id])return;useUp(c.id);HOLE=null;
  const r=Math.random()*100;
  if(r<HOLE_CH[c.rar]){const w=byId('l1');gain('l1');log(`${S.nick}님이 블랙홀에서 ${w.name}을(를) 건졌어요!`);save();renderTop();showGot(w,'블랙홀 대박')}
  else if(r<HOLE_CH[c.rar]+30){const j=VAL[c.rar]*25;S.jelly+=j;save();renderTop();
    $('#modal').innerHTML=`<button class="x" data-close aria-label="닫기">×</button><div class="reveal"><h2>반짝이는 팝이 튀어나왔어요</h2><p class="story">${esc(c.name)}은(는) 사라졌지만 팝 ${j}을 받았어요.</p><div class="row" style="justify-content:center"><button class="btn alt" data-hub="hole">또 넣기</button><button class="btn ghost" data-close>닫기</button></div></div>`}
  else{save();renderTop();$('#modal').innerHTML=`<button class="x" data-close aria-label="닫기">×</button><div class="reveal"><h2>쑤우욱…</h2><p class="story">${esc(c.name)}이(가) 블랙홀 속으로 사라졌어요. 아무것도 나오지 않았어요.</p><div class="row" style="justify-content:center"><button class="btn alt" data-hub="hole">또 넣기</button><button class="btn ghost" data-close>닫기</button></div></div>`}}

/* ---------- exchange (Halloween) ---------- */

/* ---------- roulette ---------- */
const WHEEL=[{l:'팝 20',g:{j:20},w:24,c:'#FFE1EE'},{l:'팝 100',g:{j:100},w:14,c:'#DDF0FF'},{l:'큐브 5',g:{k:5},w:16,c:'#FFF1B8'},{l:'뽑기권',g:{t:1},w:8,c:'#E8DFFF'},
  {l:'팝 300',g:{j:300},w:4,c:'#D8F5E8'},{l:'큐브 20',g:{k:20},w:4,c:'#FFE4CC'},{l:'팝 50',g:{j:50},w:22,c:'#FFF6D6'},{l:'사탕 2',g:{y:2},w:8,c:'#F5DDEB'}];
let SPIN=0;
function rouletteHTML(){
  const free=S.lastRoulette!==today(),n=WHEEL.length,seg=360/n;
  const grad=WHEEL.map((x,i)=>`${x.c} ${i*seg}deg ${(i+1)*seg}deg`).join(',');
  return`<div class="panel" style="display:flex;flex-direction:column;align-items:center;gap:12px;border-radius:0 18px 18px 18px">
    <div style="position:relative;width:250px;height:250px;max-width:100%">
      <div id="wheel" style="width:100%;height:100%;border-radius:50%;border:6px solid var(--pink);background:conic-gradient(${grad});transform:rotate(${SPIN}deg);transition:transform 2.6s cubic-bezier(.15,.8,.2,1);position:relative">
        ${WHEEL.map((x,i)=>`<span style="position:absolute;left:50%;top:50%;transform:rotate(${i*seg+seg/2}deg) translateY(-92px) translateX(-50%);transform-origin:0 0;font-family:var(--display);font-size:13px;white-space:nowrap">${x.l}</span>`).join('')}
      </div>
      <span style="position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--ink)"></span>
      <span style="position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--pink)">${charSVG(BASE[0])}</span>
    </div>
    <button class="btn" data-spin>${free?'오늘 무료로 돌리기':'팝 50으로 돌리기'}</button>
    <p class="sub" style="margin:0">하루 한 번은 무료예요.</p></div>`}
function spin(){
  const free=S.lastRoulette!==today();
  if(!free){if(S.jelly<50){toast('팝이 부족해요');return}S.jelly-=50}
  S.lastRoulette=today();
  let r=Math.random()*WHEEL.reduce((a,x)=>a+x.w,0),i=0;for(;i<WHEEL.length;i++){if(r<WHEEL[i].w)break;r-=WHEEL[i].w}
  const seg=360/WHEEL.length,target=360-(i*seg+seg/2);SPIN=SPIN-SPIN%360+360*5+target;
  const w=$('#wheel');if(w)w.style.transform=`rotate(${SPIN}deg)`;
  const prize=WHEEL[i];grant(prize.g);save();renderTop();
  setTimeout(()=>{toast(`${prize.l} 당첨!`);if(tab==='shop')render()},matchMedia('(prefers-reduced-motion:reduce)').matches?50:2700)}

/* ---------- random box trade ---------- */
let RB=null;
function rboxHTML(){
  const mine=allChars().filter(c=>S.owned[c.id]);
  return`<h2>랜덤박스 거래</h2><p class="sub" style="margin:0">말랑이 하나를 상자에 넣으면 친구들 상자에서 무작위 말랑이가 와요. 같은 등급일 때가 많고, 가끔 한 등급 위나 아래가 와요.</p>
  <div class="grid">${mine.map(c=>`<button class="tile${RB===c.id?' sel':''}" data-rbpick="${c.id}">${S.owned[c.id]>1?`<span class="cnt">${S.owned[c.id]}</span>`:''}<span class="pic">${charSVG(c)}</span><span class="nm">${esc(c.name)}</span><span class="rb" style="background:${RAR[c.rar].c}">${RAR[c.rar].name}</span></button>`).join('')}</div>
  <button class="btn mint" data-rbgo ${RB?'':'disabled'}>${RB?'상자 보내기':'보낼 말랑이를 골라 주세요'}</button>`}
function rboxGo(){
  const c=byId(RB);if(!c||!S.owned[c.id])return;RB=null;
  const idx=Math.min(4,RORDER.indexOf(c.rar)),roll=Math.random();
  let ti=roll<.15?idx+1:roll<.4?idx-1:idx;ti=Math.max(0,Math.min(4,ti));
  let pool=BASE.filter(x=>x.rar===RORDER[ti]&&x.id!==c.id&&x.set!=='melo'&&(x.set!=='hallo'||eventOn()));
  if(!pool.length)pool=BASE.filter(x=>x.rar===c.rar&&x.id!==c.id);
  const got=pool[Math.floor(Math.random()*pool.length)];
  useUp(c.id);const isNew=!S.owned[got.id];gain(got.id);S.jelly+=TRADE_POP;qInc('trade');
  log(`${S.nick}님이 랜덤박스 거래로 ${got.name}을(를) 받았어요`);save();renderTop();
  showGot(got,'랜덤박스'+(isNew?' · NEW':''),`<p class="sub">${esc(c.name)}을(를) 보냈어요. 팝 +${TRADE_POP}</p>`)}

/* ---------- home hub ---------- */
function hubHTML(){
  const items=[['quest','출석·퀘스트','b5',qReady()],['adv','모험','b4',0],['melo','멜로 조합','m3',0],['hole','블랙홀','l1',0]]
    .concat(eventOn()?[['ex','교환소','h6',0]]:[]).concat([['roulette','룰렛','b9',S.lastRoulette!==today()?1:0],['make','만들기','b10',0],['rbox','랜덤박스','b11',0]]);
  return`<div class="hub">${items.map(([id,l,av,badge])=>`<button data-hub="${id}"><span class="hi">${charSVG(byId(av))}</span>${badge?`<span class="cnt">${badge}</span>`:''}<span>${l}</span></button>`).join('')}</div>`}
function openHub(id){
  if(id==='make'){tab='make';closeModal();window.scrollTo(0,0);return}
  if(id==='roulette'){tab='shop';shopTab='roulette';closeModal();window.scrollTo(0,0);return}
  advStop();HOLE=null;RB=null;
  const f={quest:questHTML,adv:advHTML,melo:meloHTML,hole:holeHTML,ex:exHTML,rbox:rboxHTML}[id];
  if($('#veil').hidden)openModal(f());else $('#modal').innerHTML='<button class="x" data-close aria-label="닫기">×</button>'+f()}
function refresh(f){const m=$('#modal'),sc=m.scrollTop;m.innerHTML='<button class="x" data-close aria-label="닫기">×</button>'+f();m.scrollTop=sc}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-tab]');if(!t)return;const d=t.dataset;
